title: Retrieval-Augmented Generation
description: >-
  Retrieval-augmented generation specifics: the RAG metric layer
  (faithfulness, answer relevancy, contextual recall and precision),
  retrieval quality evaluation, golden dataset construction from
  production traces, and RAG architecture criteria. Extends
  agentic_development, which owns the evaluation mechanics (runners,
  statistical gate semantics, golden dataset lifecycle, the trace →
  dataset → eval loop); the RAG references cross-name it and never
  restate its machinery.
