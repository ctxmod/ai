title: Agentic Development
description: >-
  Principles for developing AI software and non-deterministic systems:
  evaluation mechanics (framework positioning, statistical gates, judge
  calibration, agent evaluation, golden datasets, the trace → dataset →
  eval loop), agent orchestration (base tools versus dynamic skills,
  protocol selection, MCP authorization, runtimes, tool-server
  development), AI telemetry semantics, and the general AI development
  principles (evaluation first, observation not verdict, the interface
  axis split). Owns all evaluation machinery; the rag profile owns only
  RAG-specific metrics and criteria.
packages:
  defaults:
    - evaluation
    - orchestration
    - telemetry
